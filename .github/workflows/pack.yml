name: Build Hermes Desktop Bundled Windows Only
on:
  workflow_dispatch:


jobs:
  build-win:
    runs-on: windows-2022
    env:
      WORK_DIR: ${{ github.workspace }}/.build/desktop-job
      CACHE_DIR: ${{ github.workspace }}/.cache/desktop-inputs
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64
          cache: pip
      - name: Install python script dependencies
        run: pip install pydantic pyyaml httpx tqdm cryptography packaging
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          architecture: x64
          cache: npm
      - run: npm ci
      - name: Cache inputs
        uses: actions/cache@v4
        with:
          path: ${{ env.CACHE_DIR }}
          key: windows-hermes-desktop-bundled-${{ hashFiles('scripts/bundles/**') }}
      - name: Prepare
        run: python scripts/bundles/desktop.py --commit=${{ github.sha }} --variant bundled --prepare-only --work "${{ env.WORK_DIR }}" --cache "${{ env.CACHE_DIR }}"
      - name: Build bundle
        run: python scripts/bundles/desktop.py --prepared "${{ env.WORK_DIR }}/prepared.json"
      - name: List outputs
        run: ls -Recurse "${{ env.WORK_DIR }}"
      - uses: actions/upload-artifact@v4
        with:
          name: hermes-desktop-bundled-win
          path: ${{ env.WORK_DIR }}/**
