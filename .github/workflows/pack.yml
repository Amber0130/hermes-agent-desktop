name: Build Hermes Desktop Bundled
run-name: Build bundled

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # 手动触发，支持手动输入版本tag
    inputs:
      tag:
        description: Version tag (e.g. v0.1.0)
        required: true
        default: v0.1.0

jobs:
  build-bundled:
    name: Build windows-latest bundled
    runs-on: windows-latest

    env:
      TAG: ${{ github.event.inputs.tag || 'v0.1.0' }}
      WORK_DIR: ${{ github.workspace }}/.build/desktop-job
      CACHE_DIR: ${{ github.workspace }}/.cache/desktop-inputs

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true # Hermes 依赖git-lfs，不可省略

      # ========== Python 环境准备 ==========
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install python build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/bundles/requirements.txt
        working-directory: ${{ github.workspace }}

      # ========== Node 环境准备（Electron前端编译需要） ==========
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install monorepo npm dependencies
        run: npm ci

      # ========== 缓存：复用desktop打包的输入资源（Python解释器、wheel包等） ==========
      - name: Cache desktop bundle inputs
        uses: actions/cache@v4
        with:
          path: ${{ env.CACHE_DIR }}
          key: ${{ matrix.os }}-hermes-desktop-bundled-${{ hashFiles('scripts/bundles/**') }}
          restore-keys: |
            ${{ matrix.os }}-hermes-desktop-bundled-

      # ========== 阶段1：Prepare Only 准备阶段，生成prepared.json ==========
      - name: Prepare desktop bundle
        run: |
          python scripts/bundles/desktop.py \
            --tag ${{ env.TAG }} \
            --variant bundled \
            --prepare-only \
            --work "${{ env.WORK_DIR }}" \
            --cache "${{ env.CACHE_DIR }}"

      # ========== 阶段2：基于prepared.json执行真正打包组装 ==========
      - name: Build bundled desktop from prepared manifest
        run: |
          python scripts/bundles/desktop.py \
            --prepared "${{ env.WORK_DIR }}/prepared.json"

      # ========== 查看产物：打印目录结构与所有文件 ==========
      - name: List bundled output artifacts
        run: |
          echo "=== Work dir content ==="
          ls -la "${{ env.WORK_DIR }}"
          echo "=== All bundled output files ==="
          find "${{ env.WORK_DIR }}" -type f
        shell: bash

      # ========== 上传完整bundled产物为Artifact ==========
      - name: Upload bundled desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: hermes-desktop-bundled-${{ matrix.os }}
          path: ${{ env.WORK_DIR }}/**
          retention-days: 7
