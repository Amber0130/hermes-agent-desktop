name: Build Hermes Offline Portable (Wrapper EXE, No Source Mod)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-win-offline:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: 'uv'

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install uv

      - name: Build full venv (root project)
        run: |
          uv sync --frozen
          uv cache clean
          Get-ChildItem .venv -Recurse -Include __pycache__ | Remove-Item -Recurse -Force
        shell: pwsh

      - name: Install npm dependencies
        run: npm ci

      - name: Electron pack, generate win-unpacked
        working-directory: ./apps/desktop
        run: npm run pack

      - name: Copy built venv into win-unpacked/resources/runtime
        run: |
          $unpackRoot = "./apps/desktop/release/win-unpacked"
          $runtimeDest = Join-Path $unpackRoot "resources\runtime"
          New-Item -ItemType Directory -Force -Path $runtimeDest
          Copy-Item -Recurse -Force ./.venv/* $runtimeDest
        shell: pwsh

      # ========== 构建Go Wrapper EXE ==========
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Generate wrapper.go source
        run: |
          $goSrc = @'
package main

import (
	"os"
	"path/filepath"
	"syscall"
	"unsafe"
)

func main() {
	exePath, err := os.Executable()
	if err != nil {
		panic(err)
	}
	appDir := filepath.Dir(exePath)

	os.Setenv("HERMES_HOME", filepath.Join(appDir, "data"))
	os.Setenv("HERMES_RUNTIME_DIR", filepath.Join(appDir, "resources", "runtime"))
	os.Setenv("HERMES_SKIP_RUNTIME_INSTALL", "true")
	os.Setenv("UV_PYTHON", filepath.Join(appDir, "resources", "runtime", "Scripts", "python.exe"))
	os.Setenv("UV_EXE", filepath.Join(appDir, "resources", "runtime", "Scripts", "uv.exe"))

	origExe := filepath.Join(appDir, "Hermes Agent Desktop-orig.exe")

	var startup syscall.StartupInfo
	var procInfo syscall.ProcessInformation
	startup.Cb = uint32(unsafe.Sizeof(startup))

	err = syscall.CreateProcess(
		syscall.StringToUTF16Ptr(origExe),
		nil,
		nil,
		nil,
		false,
		0,
		nil,
		nil,
		&startup,
		&procInfo,
	)
	if err != nil {
		panic(err)
	}
	syscall.WaitForSingleObject(procInfo.hProcess, syscall.INFINITE)
	syscall.CloseHandle(procInfo.hProcess)
	syscall.CloseHandle(procInfo.hThread)
}
'@
          $goSrc | Out-File -Encoding utf8 wrapper.go
        shell: pwsh

      - name: Build wrapper.exe (GUI 无控制台窗口)
        run: |
          go build -ldflags="-H windowsgui" -o wrapper.exe wrapper.go
        shell: pwsh

      - name: Replace original exe with wrapper
        run: |
          $unpackRoot = "./apps/desktop/release/win-unpacked"
          $origExe = Join-Path $unpackRoot "Hermes Agent Desktop.exe"
          $renamedOrig = Join-Path $unpackRoot "Hermes Agent Desktop-orig.exe"
          Move-Item -Path $origExe -Destination $renamedOrig -Force
          Copy-Item -Path ./wrapper.exe -Destination $origExe -Force
        shell: pwsh

      - name: Compress portable zip
        run: |
          Compress-Archive -Path ./apps/desktop/release/win-unpacked -DestinationPath ./Hermes-Agent-Offline-Wrapper.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hermes-Offline-Wrapper
          path: Hermes-Agent-Offline-Wrapper.zip

  release:
    needs: build-win-offline
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Hermes-Agent-Offline-Wrapper/*.zip
          generate_release_notes: true
