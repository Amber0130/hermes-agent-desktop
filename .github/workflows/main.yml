name: Build Hermes Agent Bundle

# 触发：打tag时运行，例如git tag v0.1.0 && git push --tags
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Setup PowerShell ExecutionPolicy
        shell: pwsh
        run: |
          Set-ExecutionPolicy Bypass -Scope Process -Force

      - name: Run Hermes install.ps1
        shell: pwsh
        run: |
          # 执行官方一行安装脚本
          irm https://hermes-agent.nousresearch.com/install.ps1 | iex

      - name: Show install folder
        shell: pwsh
        run: |
          $hermesPath = "$env:LOCALAPPDATA\hermes"
          Write-Host "Hermes安装目录: $hermesPath"
          Get-ChildItem $hermesPath

      - name: Zip Hermes folder
        shell: pwsh
        run: |
          $hermesPath = "$env:LOCALAPPDATA\hermes"
          $zipPath = "$env:GITHUB_WORKSPACE\hermes-bundle.zip"
          Compress-Archive -Path $hermesPath -DestinationPath $zipPath -Force
          Write-Host "打包输出: $zipPath"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: hermes-bundle.zip
          generate_release_notes: true
