name: Build Hermes Agent Bundle
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Set PowerShell ExecutionPolicy
        shell: pwsh
        run: |
          Set-ExecutionPolicy Bypass -Scope Process -Force

      - name: Download Hermes install.ps1
        shell: pwsh
        run: |
          irm https://hermes-agent.nousresearch.com/install.ps1 -OutFile install.ps1

      - name: Run Hermes Install — Custom Output Directory
        shell: pwsh
        run: |
          $hermesPath = Join-Path $env:GITHUB_WORKSPACE "hermes"
          Write-Host "Hermes 安装目录：$hermesPath"

          if(Test-Path $hermesPath){
            Remove-Item $hermesPath -Recurse -Force
          }
          $env:HERMES_NONINTERACTIVE="1"
          .\install.ps1 -HermesHome $hermesPath *> install-log.txt

      - name: Validate custom hermes directory
        shell: pwsh
        run: |
          $hermesPath = Join-Path $env:GITHUB_WORKSPACE "hermes"
          Write-Host "校验路径：$hermesPath"
          if (-not (Test-Path $hermesPath)) {
            Write-Error "自定义目录 $hermesPath 不存在，安装失败"
            exit 1
          }

      # ========= 新增：清理全部 __pycache__ 缓存目录 =========
      - name: Clean __pycache__ folders
        shell: pwsh
        run: |
          $hermesPath = Join-Path $env:GITHUB_WORKSPACE "hermes"
          Get-ChildItem -Path $hermesPath -Recurse -Directory -Filter "__pycache__" | Remove-Item -Recurse -Force
          Write-Host "✅ All __pycache__ removed"
          # 杀死所有残留 hermes / python 子进程，释放gateway.lock
          taskkill /F /IM python.exe 2>nul
          taskkill /F /IM pythonw.exe 2>nul
          taskkill /F /IM hermes.exe 2>nul
          # 删除 stale gateway.lock
          if (Test-Path hermes/gateway.lock) { Remove-Item hermes/gateway.lock -Force }
          # 清理 __pycache__
          Get-ChildItem .venv -Recurse -Include __pycache__ | Remove-Item -Recurse -Force

      - name: Zip custom hermes folder
        shell: pwsh
        run: |
          $hermesPath = Join-Path $env:GITHUB_WORKSPACE "hermes"
          $zipOutput = Join-Path $env:GITHUB_WORKSPACE "hermes-bundle.zip"
          Compress-Archive -Path $hermesPath -DestinationPath $zipOutput -Force
          Write-Host "打包产物：$zipOutput"

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: hermes-bundle.zip
          generate_release_notes: true
