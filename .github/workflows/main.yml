name: Build Hermes Offline Package (方案A)
run-name: Build Hermes Package A ${{ github.sha }}
on:
  workflow_dispatch: # 手动触发，网页Actions点Run workflow

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout workspace
        uses: actions/checkout@v4

      - name: PowerShell ExecutionPolicy
        shell: powershell
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser -Force

      - name: Download official install.ps1
        shell: powershell
        run: |
          irm https://hermes-agent.nousresearch.com/install.ps1 -OutFile install.ps1

      - name: Run official install full download
        shell: powershell
        run: |
          iex .\install.ps1
          hermes --version
          hermes desktop

      - name: Prepare package root
        shell: powershell
        run: |
          $pkgRoot="${{ github.workspace }}\hermes-offline-pkg"
          New-Item "$pkgRoot" -ItemType Directory -Force
          # 打包根目录下放原版脚本
          Copy-Item install.ps1 "$pkgRoot\" -Force

          # 1. 复制官方hermes主目录 %LOCALAPPDATA%\hermes
          Copy-Item "$env:LOCALAPPDATA\hermes" "$pkgRoot\hermes" -Recurse -Force

          $srcNpmCache = "$env:APPDATA\npm-cache"
          if (Test-Path $srcNpmCache) {
            Copy-Item $srcNpmCache "$pkgRoot\npm-cache" -Recurse -Force
          } else {
            Write-Warning "npm-cache not found, skip copy: $srcNpmCache"
          }
          # 2. uv缓存 %USERPROFILE\.cache\uv
          $srcUvCache = "$env:USERPROFILE\.cache\uv"
          New-Item "$pkgRoot\.cache" -ItemType Directory -Force
          if (Test-Path $srcUvCache) {
            Copy-Item $srcUvCache "$pkgRoot\.cache\uv" -Recurse -Force
          } else {
            Write-Error "uv cache missing: $srcUvCache"
            exit 1
          }
          # 4. playwright浏览器缓存
          $srcPlaywright = "$env:LOCALAPPDATA\ms-playwright"
          if (Test-Path $srcPlaywright) {
            Copy-Item $srcPlaywright "$pkgRoot\ms-playwright" -Recurse -Force
          } else {
            Write-Warning "ms-playwright not found, skip copy: $srcPlaywright"
          }


      - name: Compress zip
        shell: powershell
        run: |
          Compress-Archive -Path "${{ github.workspace }}\hermes-offline-pkg\*" -DestinationPath "${{ github.workspace }}\hermes-packageA-win-x64.zip" -CompressionLevel Fastest -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hermes-packageA-win-x64
          path: ${{ github.workspace }}\hermes-packageA-win-x64.zip
