name: Build Hermes Offline Package (方案A)
run-name: Build Hermes Package A ${{ github.sha }}
on:
  workflow_dispatch: # 手动触发，网页Actions点Run workflow

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout workspace
        uses: actions/checkout@v4

      - name: PowerShell ExecutionPolicy
        shell: powershell
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser -Force

      - name: Download official install.ps1
        shell: powershell
        run: |
          irm https://hermes-agent.nousresearch.com/install.ps1 -OutFile install.ps1

      - name: Run official install full download
        shell: powershell
        run: |
          .\install.ps1
          hermes --version
          hermes tools

      - name: Prepare package root
        shell: powershell
        run: |
          $pkgRoot="${{ github.workspace }}\hermes-offline-pkg"
          New-Item "$pkgRoot" -ItemType Directory -Force
          # 打包根目录下放原版脚本
          Copy-Item install.ps1 "$pkgRoot\" -Force

          # 1. 复制官方hermes主目录 %LOCALAPPDATA%\hermes
          Copy-Item "$env:LOCALAPPDATA\hermes" "$pkgRoot\hermes" -Recurse -Force

          # 2. uv缓存 %USERPROFILE\.cache\uv
          New-Item "$pkgRoot\.cache" -ItemType Directory -Force
          Copy-Item "$env:USERPROFILE\.cache\uv" "$pkgRoot\.cache\uv" -Recurse -Force

          # 3. npm缓存 %APPDATA%\npm-cache
          Copy-Item "$env:APPDATA\npm-cache" "$pkgRoot\npm-cache" -Recurse -Force

          # 4. playwright浏览器缓存
          Copy-Item "$env:LOCALAPPDATA\ms-playwright" "$pkgRoot\ms-playwright" -Recurse -Force

          # 复制配置模板（不带密钥）
          $cfgSrc="$env:LOCALAPPDATA\hermes"
          if(Test-Path "$cfgSrc\.env"){
            Copy-Item "$cfgSrc\.env" "$pkgRoot\hermes\.env.template" -Force
          }
          if(Test-Path "$cfgSrc\config.yaml"){
            Copy-Item "$cfgSrc\config.yaml" "$pkgRoot\hermes\config.yaml" -Force
          }

      - name: Compress zip
        shell: powershell
        run: |
          Compress-Archive -Path "${{ github.workspace }}\hermes-offline-pkg\*" -DestinationPath "${{ github.workspace }}\hermes-packageA-win-x64.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hermes-packageA-win-x64
          path: ${{ github.workspace }}\hermes-packageA-win-x64.zip
