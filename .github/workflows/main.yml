name: Build Hermes Agent Bundle
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Set PowerShell ExecutionPolicy
        shell: pwsh
        run: |
          Set-ExecutionPolicy Bypass -Scope Process -Force

      - name: Download Hermes install.ps1
        shell: pwsh
        run: |
          irm https://hermes-agent.nousresearch.com/install.ps1 -OutFile install.ps1

      - name: Run Hermes Install — Custom Output Directory
        shell: pwsh
        run: |
          # ========== 自定义安装目录 ==========
          $hermesPath = Join-Path $env:GITHUB_WORKSPACE "hermes"
          Write-Host "Hermes 安装目录：$hermesPath"

          # 先清空旧目录
          if(Test-Path $hermesPath){
            Remove-Item $hermesPath -Recurse -Force
          }

          # 指定 HermesHome 安装到自定义目录
          .\install.ps1 -HermesHome $hermesPath

      - name: Validate custom hermes directory
        shell: pwsh
        run: |
          $hermesPath = Join-Path $env:GITHUB_WORKSPACE "hermes"
          Write-Host "校验路径：$hermesPath"
          if (-not (Test-Path $hermesPath)) {
            Write-Error "自定义目录 $hermesPath 不存在，安装失败"
            exit 1
          }
          Get-ChildItem $hermesPath

      - name: Zip custom hermes folder
        shell: pwsh
        run: |
          $hermesPath = Join-Path $env:GITHUB_WORKSPACE "hermes"
          $zipOutput = Join-Path $env:GITHUB_WORKSPACE "hermes-bundle.zip"
          Compress-Archive -Path $hermesPath -DestinationPath $zipOutput -Force
          Write-Host "打包产物：$zipOutput"

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: hermes-bundle.zip
          generate_release_notes: true
